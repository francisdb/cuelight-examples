name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push replaces a pull request's run, but never stops a run on main:
# that would cancel a deploy halfway. Runs on main queue up instead.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: check shows, build site
    runs-on: ubuntu-latest
    steps:
      # Side by side, the way the tools expect the two repositories.
      - uses: actions/checkout@v7
        with:
          path: cuelight-examples
      - uses: actions/checkout@v7
        with:
          repository: francisdb/cuelight
          path: cuelight
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cuelight
            cuelight-examples/tools/thumbnails
      # Also: no missing or unused assets, no driver step the show ignores.
      - name: Every show loads without warnings
        run: cargo run --manifest-path cuelight-examples/tools/thumbnails/Cargo.toml --no-default-features -- --check
      - name: Install wasm-bindgen, the version cuelight locks
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' cuelight/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y "wasm-bindgen-cli@$version"
      - name: Build the site
        run: cuelight-examples/site/build.sh
        env:
          # a smaller player; nothing else shares this build
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cuelight-examples/_site

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Relative links as files, the others online. The cards and source
      # links of the site are made from examples.json, whose paths the
      # build checks.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.md' 'site/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lint:
    name: lint the tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cuelight-examples
      - uses: actions/checkout@v7
        with:
          repository: francisdb/cuelight
          path: cuelight
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cuelight-examples/tools/thumbnails
      - name: rustfmt
        run: cargo fmt --manifest-path cuelight-examples/tools/thumbnails/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path cuelight-examples/tools/thumbnails/Cargo.toml -- -D warnings
      - name: clippy (check only, as the build job uses it)
        run: cargo clippy --manifest-path cuelight-examples/tools/thumbnails/Cargo.toml --no-default-features -- -D warnings
      - name: shellcheck
        run: shellcheck cuelight-examples/site/build.sh
      - name: python scripts compile
        run: python3 -m py_compile cuelight-examples/tools/*.py

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
