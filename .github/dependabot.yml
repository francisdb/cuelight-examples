version: 2
updates:
  # No cargo entry: the only Cargo project, tools/check, depends on the
  # cuelight checkout next to this repository by path, which Dependabot
  # cannot reach. Its versions follow cuelight's, which are kept up to date
  # over there.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
