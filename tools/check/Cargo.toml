# Checks that every show in examples.json loads without errors or
# warnings, and that its assets and driver match the show. It builds
# against a cuelight checkout next to this repository.
[package]
name = "cuelight-examples-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cuelight = { path = "../../../cuelight/crates/cuelight", default-features = false, features = ["outline-fonts"] }
cuelight-loader = { path = "../../../cuelight/crates/cuelight-loader" }
# Only to decode sounds; no sound device.
cuelight-audio = { path = "../../../cuelight/crates/cuelight-audio", default-features = false }
serde_json = "1"
